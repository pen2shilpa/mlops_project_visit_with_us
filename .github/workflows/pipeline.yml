name: Tourism Project MLOps Pipeline

on:
  push:
    branches:
      - main            # Automatically triggers on push to the main branch
  workflow_dispatch:    # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:
  # Register dataset Job 
  register-data:
    name: Register Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r mlops_project_visit_with_us/dependencies.txt
      - name: Register Data
        run: python mlops_project_visit_with_us/src/models/register_data.py
      - name: Upload Registered Data
        uses: actions/upload-artifact@v4
        with: 
          name: registered-data
          path: mlops_project_visit_with_us/data/tourism.csv

  # Data prepartion Job 
  data-preparation:
    name: Data Preparation
    needs: register-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r mlops_project_visit_with_us/dependencies.txt
      - name: Run Data Preparation
        run: python mlops_project_visit_with_us/src/models/preprocess_data.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # Model training Job
  model-traning:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r mlops_project_visit_with_us/dependencies.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits         # Gets the data from the previous job
      - name: Start MLflow Server
        run:   |     
          nohup mlflow ui --host 0.0.0.0 --port 5000 &      # Run MLflow UI in the background
          sleep 5                                           # Wait to allow server to start
      - name: Model Building
        run: python mlops_project_visit_with_us/src/models/train_model.py
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add  mlops_project_visit_with_us/artifacts/best_model.joblib                # path to the saved model file
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
